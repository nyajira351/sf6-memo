<style>
  :root {
    --bg: #141519;
    --bg-header: #24262d;
    --card: #1B1C22;
    --border: #24262d;
    --input: #202127;
    --accent: #E8A33D;
    --text: #ffffff;
    --text-dim: #7A7D87;
    --text-faint: #585A63;
    --red: #C1503F;
    --green: #5E9A7C;
    --c-macro: #5B8DEF;
    --c-micro: #E8A33D;
    --c-punish: #E0566B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; }
  body { min-height: 100vh; overscroll-behavior-y: contain; }
  .display { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #33343b; border-radius: 3px; }

  .personal-bar-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 32px); margin: 8px 16px 0; padding: 10px 0; border-radius: 10px; border: 1px solid rgba(232,163,61,0.35); background: rgba(232,163,61,0.12); color: var(--accent); font-size: 15px; font-weight: 700; font-family: 'Oswald', sans-serif; letter-spacing: 0.03em; }

  .header { padding: 8px 16px 5px; background: repeating-linear-gradient(115deg, rgba(232,163,61,0.045) 0 2px, transparent 2px 16px), linear-gradient(180deg, var(--bg-header), var(--bg)); border-bottom: 1px solid rgba(232,163,61,0.22); }
  .header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .back-btn { background: none; border: none; color: rgba(255,255,255,0.75); padding: 12px; margin: -8px 0 -8px -12px; display: flex; }
  .title { font-size: 20px; font-weight: 700; margin: 0; }
  .sub { font-size: 14px; color: rgba(255,255,255,0.4); margin: 2px 0 0; }

  .char-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .char-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; padding: 16px 6px; background: var(--card); border: 1px solid var(--border); }
  .char-count { position: absolute; top: 4px; right: 7px; font-size: 18px; font-weight: 700; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .char-tag { font-size: 15px; font-weight: 700; }
  .char-name { font-size: 14px; margin-top: 5px; color: rgba(255,255,255,0.8); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .vs-row { display: flex; align-items: center; justify-content: space-between; }
  .vs-side { background: none; border: none; color: inherit; text-align: left; flex: 1; padding: 0; }
  .vs-side.right { text-align: right; }
  .vs-label { font-size: 12px; color: rgba(255,255,255,0.4); margin: 0; }
  .vs-name { font-size: 22px; font-weight: 700; font-style: italic; letter-spacing: 0.04em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 rgba(0,0,0,0.6); }
  .vs-mid { font-size: 22px; font-weight: 700; font-style: italic; color: var(--accent); transform: skewX(-8deg); text-shadow: 0 0 12px rgba(232,163,61,0.55); }

  .save-indicator { font-size: 12px; }
  .save-link { font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: underline; background: none; border: none; }

  .sort-row { display: flex; gap: 6px; padding: 4px 16px 2px; }
  .sort-btn { flex: 1; font-size: 11px; padding: 5px 0; border-radius: 6px; background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }
  .sort-btn.active { background: var(--accent); border-color: var(--accent); color: #1B1C22; font-weight: 700; }

  main { flex: 1; overflow-y: auto; padding: 2px 16px 16px; padding-bottom: 96px; }
  .empty-state { text-align: center; padding: 64px 0; }
  .empty-state p:first-child { color: rgba(255,255,255,0.25); font-size: 14px; margin: 0; }
  .empty-state p:last-child { color: rgba(255,255,255,0.15); font-size: 12px; margin: 4px 0 0; }

  .section-head { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
  .section-head:first-child { margin-top: 0; }
  .section-dot { width: 5px; height: 15px; border-radius: 1px; transform: skewX(-14deg); flex-shrink: 0; }
  .section-label { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
  .section-count { font-size: 11px; color: var(--text-dim); }

  .note-list { display: flex; flex-direction: column; gap: 3px; }
  .note-card { background: var(--card); border: 1px solid var(--border); border-left-width: 4px; border-left-style: solid; border-radius: 8px; overflow: hidden; }
  .note-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 6px 8px 6px 10px; background: none; border: none; color: inherit; text-align: left; gap: 8px; }
  .note-title-line { display: flex; align-items: center; gap: 3px; min-width: 0; flex: 1; }
  .note-title { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.92); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .imp-dots { font-size: 8px; letter-spacing: 0; flex-shrink: 0; margin-right: 1px; }
  .frame-badge { font-size: 14px; font-weight: 700; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; min-width: 26px; display: inline-block; }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 3px; border-radius: 4px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; line-height: 1.4; white-space: nowrap; }
  .chip-fixed { min-width: 30px; text-align: center; padding: 1px 0; }
  .right-chips { display: flex; gap: 2px; flex-shrink: 0; align-items: center; }
  .dg { display: inline-flex; gap: 2px; flex-shrink: 0; align-items: center; margin: 0; }
  .dg-cell { width: 5px; height: 12px; border-radius: 1px; background: #FFD21E; box-shadow: 0 0 0 1px rgba(0,0,0,0.55); transform: skewX(14deg); }
  .dg-cell.on { background: #2EE57E; }
  .origin-head-btn { width: 100%; display: flex; align-items: center; gap: 8px; border-left-width: 4px !important; background: rgba(79,189,186,0.08); border: 1px solid rgba(79,189,186,0.25); border-radius: 8px; color: #4FBDBA; font-size: 13px; font-weight: 700; padding: 8px 12px; margin: 6px 0 3px; text-align: left; font-family: inherit; cursor: pointer; }
  .rcp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 2px 0 6px; }
  .rcp-step { display: inline-flex; align-items: center; gap: 2px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 3px 6px; }
  .rcp-arrows { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #fff; line-height: 1; }
  .rcp-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1B1C22; border-radius: 4px; padding: 2px 5px; line-height: 1.2; }
  .rcp-ico-img { width: 19px; height: 19px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
  .rcp-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; border-radius: 4px; padding: 2px 5px; line-height: 1.2; }
  .rcp-plain { font-size: 11px; color: var(--text-dim); }
  .rcp-sep { color: var(--text-faint); font-size: 10px; }
  .group-body { margin-left: 9px; padding-left: 8px; border-left: 2px solid rgba(255,255,255,0.09); }

const CATEGORIES = [

const activeCategories = () => (state.screen === "personal" ? PERSONAL_CATEGORIES : CATEGORIES);
const IMP_LABELS = { 1: "低", 2: "中", 3: "高" };

const STORAGE_KEY = "sf6-counter-note-data";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const s = Object.assign(defaultState(), parsed);
      s.store = migrateStore(s.store || {});
      if (!s.personalByChar) s.personalByChar = {};
      if (!s.deleted) s.deleted = {};
      if (!s.wipMarks) s.wipMarks = {};
      // 旧形式: メモ本体のwipフラグを「自分の課題マーク」へ一度だけ移行
      try {
        if (!localStorage.getItem("sf6-cn-wip-migrated")) {
          const seed = {};
          const collect = (map) => Object.keys(map || {}).forEach((k) => ((map[k] && map[k].notes) || []).forEach((n) => {
            if (n && n.wip) { seed[n.id] = { on: true, ts: n.updatedAt || Date.now() }; n.wip = false; }
          }));
          collect(s.store); collect(s.personalByChar);
          if (Object.keys(seed).length) {
            s.wipMarks.local = Object.assign({}, s.wipMarks.local || {}, seed);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
          }
          localStorage.setItem("sf6-cn-wip-migrated", "1");
        }
      } catch (e) {}
      // 旧バージョン（キャラ非依存の共通メモ）があれば、選択中の使用キャラに紐づけて引き継ぐ
      if (parsed.personal && Array.isArray(parsed.personal.notes) && parsed.personal.notes.length && parsed.selfId) {
        const key = parsed.selfId;
        const existing = s.personalByChar[key] || { notes: [] };
        s.personalByChar[key] = { notes: existing.notes.concat(parsed.personal.notes) };
      }
      return s;
    }
  } catch (e) {}
  return defaultState();
}
function defaultState() {
  return { screen: "self", selfId: null, oppId: null, store: {}, personalByChar: {}, deleted: {}, wipMarks: {}, lastBackupAt: null };
}
// 旧バージョン（クイックメモ/詳細対策/課題/確定反撃タブ）のデータを新形式へ変換
function migrateStore(store) {
  const out = {};
  Object.keys(store).forEach((key) => {
    const m = store[key];
    if (m && Array.isArray(m.notes)) {
      out[key] = Object.assign({}, m, { notes: m.notes.map((it) => Object.assign({}, it, { updatedAt: it.updatedAt || it.createdAt || Date.now() })) });
      return;
    }
    const catMap = { quick: "macro", detail: "micro", issue: "macro", punish: "punish" };
    const notes = [];
    ["quick", "detail", "issue", "punish"].forEach((tabKey) => {
      (m && m[tabKey] || []).forEach((it) => {
        const now = Date.now();
        notes.push({
          id: it.id || uid(),
          title: it.title || "",
          body: it.body || "",
          category: catMap[tabKey],
          importance: it.important ? 3 : 2,
          createdAt: now,
          updatedAt: now,
        });
      });
    });
    out[key] = { notes: notes };
  });
  return out;
}
function pairKey(self, opp) { return self + "__" + opp; }
function emptyMatchup() { return { notes: [] }; }
function uid() { return Math.random().toString(36).slice(2, 9); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let state = loadState();
let ui = {
  expandedId: null,
  editingId: null,
  adding: false,
  draft: { title: "", body: "", category: "macro", importance: 2, frame: 5, microTag: null, damage: "", position: null, throwOk: false, shimmyOk: false, origin: "", sub: "", wip: false, drive: null, recipe: "", frameKind: "" },
  backupOpen: false,
  saveFlash: "",
  minImp: 1, // 重要度フィルター 1=すべて 2=中以上 3=高のみ
  wipOnly: false,
  confirmDeleteId: null,
  titleError: false,
  openOrigins: {},
  openSubs: {},
  renameTarget: null,
  originNewMode: false,
  subNewMode: false,
  recordingField: null,
};
let voiceRecognition = null;
let renderingWip = false;
let lastGroupKeys = [];
let lastSubKeys = [];

function stopVoiceIfActive() {
  if (voiceRecognition) {
    try { voiceRecognition.onend = null; voiceRecognition.stop(); } catch (e) {}
    voiceRecognition = null;
  }
  ui.recordingField = null;
}
function toggleVoice(field) {
  if (ui.recordingField === field) { stopVoiceIfActive(); render(); return; }
  stopVoiceIfActive();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("お使いのブラウザは音声入力に対応していません。PCのChromeでお試しください。");
    return;
  }
  const baseText = ui.draft[field] || "";
  let finalText = "";
  voiceRecognition = new SR();
  voiceRecognition.lang = "ja-JP";
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = true;
  voiceRecognition.onresult = (event) => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interim += t;
    }
    const newValue = baseText + finalText + interim;
    ui.draft[field] = newValue;
    const el = document.querySelector('[data-draft="' + field + '"]');
    if (el) el.value = newValue;
  };
  voiceRecognition.onerror = () => { stopVoiceIfActive(); render(); };
  voiceRecognition.onend = () => { ui.recordingField = null; voiceRecognition = null; render(); };
  try {
    voiceRecognition.start();
    ui.recordingField = field;
    render();
  } catch (e) {
    stopVoiceIfActive();
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    ui.saveFlash = "saved";
  } catch (e) {
    ui.saveFlash = "error";
  }
  cloudOnLocalSave();
  render();
  if (ui.saveFlash === "saved") setTimeout(() => { ui.saveFlash = ""; render(); }, 1200);
}

function currentMatchup() {
  if (state.screen === "personal") {
    if (!state.selfId) return { notes: [] };
    return state.personalByChar[state.selfId] || { notes: [] };
  }
  if (!state.selfId || !state.oppId) return null;
  const key = pairKey(state.selfId, state.oppId);
  return state.store[key] || emptyMatchup();
}
function updateMatchup(fn) {
  if (state.screen === "personal") {
    if (!state.selfId) return;
    const current = state.personalByChar[state.selfId] || { notes: [] };
    const next = fn(current);
    next.metaUpdatedAt = Date.now();
    state.personalByChar[state.selfId] = next;
    save();
    return;
  }
  const key = pairKey(state.selfId, state.oppId);
  const current = state.store[key] || emptyMatchup();
  const next = fn(current);
  next.metaUpdatedAt = Date.now();
  state.store[key] = next;
  save();
}

// ---- ルーティング操作 ----
function resetEditState() { ui.adding = false; ui.editingId = null; ui.expandedId = null; ui.confirmDeleteId = null; }
function pickSelf(id) {
  resetEditState();
  state.selfId = id;
  state.screen = state.oppId ? "matchup" : "opponent";
  save();
}
function pickOpponent(id) {
  resetEditState();
  state.oppId = id;
  state.screen = "matchup";
  save();
}
function goSelf() { stopVoiceIfActive(); resetEditState(); state.screen = "self"; render(); }
function goOpponent() { stopVoiceIfActive(); resetEditState(); state.screen = "opponent"; render(); }
function goPersonal() { if (!state.selfId) return; stopVoiceIfActive(); resetEditState(); state.screen = "personal"; render(); }

function startAdd() { ui.titleError = false; ui.originNewMode = false; ui.subNewMode = false; ui.draft = { title: "", body: "", category: activeCategories()[0].id, importance: 2, frame: 5, microTag: null, damage: "", position: null, throwOk: false, shimmyOk: false, origin: "", sub: "", wip: false, drive: null, recipe: "", frameKind: "" }; ui.adding = true; ui.editingId = null; render(); focusFirstInput(); }
function cancelForm() { stopVoiceIfActive(); ui.adding = false; ui.editingId = null; ui.titleError = false; render(); }
function saveAdd() {
  stopVoiceIfActive();
  if (!ui.draft.title.trim()) { ui.titleError = true; render(); return; }
  ui.titleError = false;
  const newNoteId = uid();
  if (ui.draft.wip) setWip(newNoteId, true, true);
  updateMatchup((m) => {
    const next = Object.assign({}, m);
    const now = Date.now();
    next.notes = m.notes.concat([{
      id: newNoteId, title: ui.draft.title.trim(), body: ui.draft.body.trim(),
      category: ui.draft.category, importance: ui.draft.importance,
      frame: (ui.draft.category === "punish" || ui.draft.category === "setplay") && ui.draft.frame !== "" ? parseInt(ui.draft.frame, 10) : null,
      damage: ui.draft.category === "combo" && String(ui.draft.damage || "").trim() !== "" ? parseInt(ui.draft.damage, 10) : null,
      position: (ui.draft.category === "setplay" || ui.draft.category === "combo") ? ui.draft.position : null,
      throwOk: ui.draft.category === "setplay" ? !!ui.draft.throwOk : false,
      shimmyOk: ui.draft.category === "setplay" ? !!ui.draft.shimmyOk : false,
      origin: String(ui.draft.origin || "").trim(),
      sub: String(ui.draft.sub || "").trim(),
      recipe: (ui.draft.category === "combo" || ui.draft.category === "setplay") ? normalizeRecipe(ui.draft.recipe || "") : "",
      frameKind: (ui.draft.category === "punish" || ui.draft.category === "setplay") ? String(ui.draft.frameKind || "") : "",
      wip: false,
      drive: (ui.draft.category === "combo" || ui.draft.category === "setplay") && ui.draft.drive !== null && ui.draft.drive !== undefined && ui.draft.drive !== "" ? parseInt(ui.draft.drive, 10) : null,
      microTag: ui.draft.category === "micro" ? ui.draft.microTag : null,
      createdAt: now, updatedAt: now,
    }]);
    return next;
  });
  ui.adding = false;
  ui.draft = { title: "", body: "", category: activeCategories()[0].id, importance: 2, frame: 5, microTag: null, damage: "", position: null, throwOk: false, shimmyOk: false, origin: "", sub: "", wip: false, drive: null, recipe: "", frameKind: "" };
}
function startEdit(itemId, fromWip) {
  const m = currentMatchup();
  const item = m.notes.find((it) => it.id === itemId);
  if (!item) return;
  ui.draft = { title: item.title, body: item.body, category: item.category, importance: item.importance, frame: (item.frame === null || item.frame === undefined) ? (item.category === "setplay" ? "" : 5) : item.frame, microTag: item.microTag || null, damage: item.damage != null ? String(item.damage) : "", position: item.position || null, throwOk: !!item.throwOk, shimmyOk: !!item.shimmyOk, origin: item.origin || "", sub: item.sub || "", recipe: item.recipe || "", frameKind: item.frameKind || "", wip: isWip(item.id), drive: (item.drive === null || item.drive === undefined) ? null : item.drive };
  ui.editingId = itemId;
  ui.editingFromWip = !!fromWip;
  ui.adding = false;
  ui.originNewMode = false;
  ui.subNewMode = false;
  ui.titleError = false;
  render();

}
function saveEdit(itemId) {
  stopVoiceIfActive();
  if (!ui.draft.title.trim()) { ui.titleError = true; render(); return; }
  ui.titleError = false;
  setWip(itemId, !!ui.draft.wip, true);
  updateMatchup((m) => {
    const next = Object.assign({}, m);
    next.notes = m.notes.map((it) => it.id === itemId ? Object.assign({}, it, {
      title: ui.draft.title.trim(), body: ui.draft.body,
      category: ui.draft.category, importance: ui.draft.importance,
      frame: (ui.draft.category === "punish" || ui.draft.category === "setplay") && ui.draft.frame !== "" ? parseInt(ui.draft.frame, 10) : null,
      damage: ui.draft.category === "combo" && String(ui.draft.damage || "").trim() !== "" ? parseInt(ui.draft.damage, 10) : null,
      position: (ui.draft.category === "setplay" || ui.draft.category === "combo") ? ui.draft.position : null,
      throwOk: ui.draft.category === "setplay" ? !!ui.draft.throwOk : false,
      shimmyOk: ui.draft.category === "setplay" ? !!ui.draft.shimmyOk : false,
      origin: String(ui.draft.origin || "").trim(),
      sub: String(ui.draft.sub || "").trim(),
      recipe: (ui.draft.category === "combo" || ui.draft.category === "setplay") ? normalizeRecipe(ui.draft.recipe || "") : "",
      frameKind: (ui.draft.category === "punish" || ui.draft.category === "setplay") ? String(ui.draft.frameKind || "") : "",
      wip: false,
      drive: (ui.draft.category === "combo" || ui.draft.category === "setplay") && ui.draft.drive !== null && ui.draft.drive !== undefined && ui.draft.drive !== "" ? parseInt(ui.draft.drive, 10) : null,
      microTag: ui.draft.category === "micro" ? ui.draft.microTag : null,
      updatedAt: Date.now(),
    }) : it);
    return next;
  });
  ui.editingId = null;
}
function applyRename() {
  const rt = ui.renameTarget;
  if (!rt) return;
  const newVal = String(rt.value || "").trim();
  if (!newVal || newVal === rt.key) { ui.renameTarget = null; render(); return; }
  updateMatchup((m) => {
    const next = Object.assign({}, m);
    if (rt.type === "group") {
      next.notes = m.notes.map((n) => {
        if (n.category !== rt.catId) return n;
        const k = (n.origin || "").trim() || "その他";
        if (k !== rt.key) return n;
        return Object.assign({}, n, { origin: newVal === "その他" ? "" : newVal });
      });
      const groupOrder = Object.assign({}, m.groupOrder || {});
      if (groupOrder[rt.catId]) {
        groupOrder[rt.catId] = groupOrder[rt.catId].map((k) => (k === rt.key ? newVal : k));
      }
      next.groupOrder = groupOrder;
      const subOrder = Object.assign({}, m.subOrder || {});
      const oldSubKey = rt.catId + "::" + rt.key;
      const newSubKey = rt.catId + "::" + newVal;
      if (subOrder[oldSubKey]) { subOrder[newSubKey] = subOrder[oldSubKey]; delete subOrder[oldSubKey]; }
      next.subOrder = subOrder;
    } else {
      next.notes = m.notes.map((n) => {
        if (n.category !== rt.catId) return n;
        if (((n.origin || "").trim() || "その他") !== rt.groupKey) return n;
        if ((n.sub || "").trim() !== rt.key) return n;
        return Object.assign({}, n, { sub: newVal });
      });
      const subOrder = Object.assign({}, m.subOrder || {});
      const okey = rt.catId + "::" + rt.groupKey;
      if (subOrder[okey]) {
        subOrder[okey] = subOrder[okey].map((k) => (k === rt.key ? newVal : k));
      }
      next.subOrder = subOrder;
    }
    return next;
  });
  ui.renameTarget = null;
}

function deleteItem(itemId) {
  ui.confirmDeleteId = null;
  if (!state.deleted) state.deleted = {};
  state.deleted[itemId] = Date.now();
  if (state.wipMarks) Object.keys(state.wipMarks).forEach((k) => { if (state.wipMarks[k]) delete state.wipMarks[k][itemId]; });
  updateMatchup((m) => {
    const next = Object.assign({}, m);
    next.notes = m.notes.filter((it) => it.id !== itemId);
    return next;
  });
  if (ui.expandedId === itemId) ui.expandedId = null;
}
function toggleExpand(itemId) { ui.expandedId = ui.expandedId === itemId ? null : itemId; ui.confirmDeleteId = null; render(); }
function setDraftField(field, value) { ui.draft[field] = value; }
function focusFirstInput() {
  requestAnimationFrame(() => {
    const el = document.querySelector(".item-form input[type=text]");
    if (el && !el.value) el.focus();
  });
}

function openBackup() { ui.backupOpen = true; render(); }
function closeBackup() { ui.backupOpen = false; render(); }
function copyBackup() {
  const json = JSON.stringify({ store: state.store, personalByChar: state.personalByChar }, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    const el = document.getElementById("copy-status");
    if (el) el.textContent = "コピーしました";
  }).catch(() => {
    const el = document.getElementById("copy-status");
    if (el) el.textContent = "コピー失敗（手動選択してください）";
  });
}
function importBackup() {
  const ta = document.getElementById("import-text");
  const errEl = document.getElementById("import-error");
  try {
    const parsed = JSON.parse(ta.value);
    applyImportedData(parsed);
    errEl.textContent = "";
    ui.backupOpen = false;
    save();
  } catch (e) {
    errEl.textContent = "読み込めませんでした。コピーしたテキストをそのまま貼り付けてください。";
  }
}

function applyImportedData(parsed) {
  if (parsed && (parsed.store || parsed.personalByChar)) {
    state.store = migrateStore(parsed.store || {});
    state.personalByChar = parsed.personalByChar || {};
  } else {
    // 旧形式（対策メモのみ）のバックアップとの互換用
    state.store = migrateStore(parsed);
  }
}
function exportFile() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const filename = "counter-note-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
  const blob = new Blob([JSON.stringify({ store: state.store, personalByChar: state.personalByChar }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  state.lastBackupAt = Date.now();
  save();
  const el = document.getElementById("file-status");
  if (el) el.textContent = filename + " を保存しました";
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      applyImportedData(parsed);
      ui.backupOpen = false;
      save();
    } catch (e) {
      const el = document.getElementById("file-status");
      if (el) { el.textContent = "読み込めませんでした。保存したJSONファイルを選択してください。"; el.style.color = "var(--red)"; }
    }
  };
  reader.readAsText(file);
}

// ---- レンダリング ----
function render() {
  const app = document.getElementById("app");
  let body;
  if (state.screen === "self") {
    body = renderCharGrid("使用キャラクターを選択", "まず自分の使用キャラを選んでください", "self", false);
  } else if (state.screen === "opponent") {
    const sub = state.selfId ? "使用: " + esc(charById(state.selfId).name) : "";
    body = renderCharGrid("対戦相手を選択", sub, "opponent", true);
  } else if (state.screen === "matchup" && state.selfId && state.oppId) {
    body = renderMatchup();
  } else if (state.screen === "personal") {
    body = renderPersonal();
  } else {
    state.screen = "self";
    body = renderCharGrid("使用キャラクターを選択", "まず自分の使用キャラを選んでください", "self", false);
  }
  const bar = (state.screen !== "personal" && state.screen !== "self" && state.selfId)
    ? '<button class="personal-bar-btn" data-nav="personal">📝 ' + esc(charById(state.selfId).name) + '用メモを開く</button>'
    : "";
  app.innerHTML = bar + body + (ui.backupOpen ? renderBackupModal() : "");
  attachHandlers();
}

function renderCharGrid(title, sub, mode, showBack) {
  const cards = CHARACTERS.map((c, i) => {
    let countHtml = "";
    if (mode === "opponent" && state.selfId) {
      const mm = state.store[pairKey(state.selfId, c.id)];
      const n = mm && mm.notes ? mm.notes.length : 0;
      if (n > 0) countHtml = '<span class="char-count">' + n + '</span>';
    }
    return '<button class="char-btn" data-pick="' + mode + '" data-id="' + c.id + '">' +
      countHtml +
      '<span class="char-tag" style="color:hsl(' + [32,20,10,200,165,45][i % 6] + ',45%,62%)">' + esc(c.tag) + '</span>' +
      '<span class="char-name">' + esc(c.name) + '</span>' +
    '</button>';
  }).join("");
  return (
    '<div class="header">' +
      '<div class="header-row">' +
        (showBack ? '<button class="back-btn" data-nav="self">' + iconChevronLeft() + '</button>' : '') +
        '<div><h1 class="title display">' + esc(title) + '</h1>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + '</div>' +
        '<div style="margin-left:auto">' + backupLinkHtml() + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="char-grid">' + cards + '</div>'
  );
}

function impDots(level) {
  let s = "";
  for (let i = 1; i <= 3; i++) s += i <= level ? "●" : "○";
  return s;
}
function formatFrame(n, kind) {
  const prefix = kind === "guard" ? "G" : kind === "hit" ? "H" : "";
  if (n > 0) return prefix + "+" + n + "F";
  if (n < 0) return prefix + n + "F";
  return prefix + "0F";
}
function frameColor(n) {
  if (n > 0) return "var(--red)";
  if (n < 0) return "var(--c-macro)";
  return "var(--text-dim)";
}

function microTagColor(tag) {
  if (tag === "DP") return "var(--green)";
  if (tag === "DI") return "var(--red)";
  return "var(--text-dim)";
}

function rcpBtnIcon(b) {
  if (b === "PP" || b === "KK") {
    const src = RCP_IMG[b === "PP" ? "PO" : "KO"];
    return '<img class="rcp-ico-img" src="' + src + '"><img class="rcp-ico-img" src="' + src + '">';
  }
  if (b === "P" || b === "K") {
    return '<img class="rcp-ico-img" src="' + RCP_IMG[b === "P" ? "PN" : "KN"] + '">';
  }
  const isKick = b[1] === "K";
  const key = (isKick ? "K" : "P") + b[0];
  const src = RCP_IMG[key];
  return src ? '<img class="rcp-ico-img" src="' + src + '">' : "";
}
function rcpBtnColor(b) {
  if (b === "PP" || b === "KK") return "#E8A33D";
  if (b[0] === "L") return "#3FC0C9";
  if (b[0] === "M") return "#C9C34A";
  return "#D4586B";
}
function normalizeRecipe(s) {
  return String(s)
    .replace(/[\uFF01-\uFF5E]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
    .replace(/\u3000/g, " ")
    .toUpperCase()
    .replace(/\s+/g, " ")
    .trim();
}
function renderRecipe(recipe) {
  const tokens = normalizeRecipe(recipe).split(" ").filter(Boolean);
  if (!tokens.length) return "";
  const parts = tokens.map(function (tok) {
    const up = tok.toUpperCase();
    if (RCP_SPECIALS[up]) {
      return '<span class="rcp-step"><span class="rcp-tag" style="background:' + RCP_SPECIALS[up][1] + '">' + RCP_SPECIALS[up][0] + '</span></span>';
    }
    const m = up.match(/^([1-9]+)?(J)?(OD)?(LP|MP|HP|LK|MK|HK|PP|KK|P|K)?(PC|TC|C)?$/);
    if (!m || (!m[1] && !m[2] && !m[4])) {
      return '<span class="rcp-step"><span class="rcp-plain">' + esc(tok) + '</span></span>';
    }
    let s = '<span class="rcp-step">';
    if (m[1]) {
      s += '<span class="rcp-arrows">' + m[1].split("").map(function (d) { return RCP_ARROWS[d] || d; }).join("") + '</span>';
    }
    if (m[2]) s += '<span class="rcp-tag" style="background:#5B8DEF">J</span>';
    if (m[3]) s += '<span class="rcp-tag" style="background:#E8A33D">OD</span>';
    if (m[4]) s += rcpBtnIcon(m[4]);
    if (m[5]) {
      const sufColor = m[5] === "PC" ? "#E0566B" : m[5] === "C" ? "#E8914A" : "#4FBDBA";
      s += '<span class="rcp-tag" style="background:' + sufColor + '">' + m[5] + '</span>';
    }
    return s + '</span>';
  });
  return '<div class="rcp-row">' + parts.join('<span class="rcp-sep">▸</span>') + '</div>';
}

function backupLinkHtml() {
  if (getFbConfig()) {
    let label = "☁ 同期", style = "";
    if (cloud.status === "synced") { label = "☁ 同期済み"; style = "color:var(--green)"; }
    else if (cloud.status === "syncing" || cloud.status === "loading") { label = "☁ 同期中…"; style = "color:var(--accent)"; }
    else if (cloud.status === "nologin") { label = "☁ ログイン"; style = "color:var(--accent);font-weight:700"; }
    else if (cloud.status === "error") { label = "☁ エラー"; style = "color:var(--red);font-weight:700"; }
    return '<button class="save-link" style="' + style + '" data-open="backup">' + label + '</button>';
  }
  const stale = !state.lastBackupAt || (Date.now() - state.lastBackupAt) > 14 * 24 * 60 * 60 * 1000;
  if (stale) return '<button class="save-link" style="color:var(--accent);font-weight:700" data-open="backup">⚠ バックアップ</button>';
  return '<button class="save-link" data-open="backup">バックアップ</button>';
}

function driveBar(n) {
  let s = '<span class="dg">';
  for (let i = 0; i < 6; i++) s += '<span class="dg-cell' + (i >= n ? ' on' : '') + '"></span>';
  return s + '</span>';
}

function renderNoteCard(item) {
  const cat = catById(item.category);
  const cardKey = (renderingWip ? "wip::" : "") + item.id;
  const expanded = ui.expandedId === cardKey;
  if (ui.editingId === item.id) {
    if (renderingWip === !!ui.editingFromWip) return renderForm(item.id);
    return "";
  }
  let leftChip = "";
  if (item.category === "punish" || item.category === "setplay") {
    leftChip = (item.frame !== null && item.frame !== undefined)
      ? '<span class="chip chip-fixed" style="color:' + frameColor(item.frame) + '">' + formatFrame(item.frame, item.frameKind) + '</span>'
      : '<span class="chip chip-fixed"></span>';
  } else if (item.category === "combo") {
    leftChip = item.damage != null
      ? '<span class="chip chip-fixed" style="color:#1B1C22;background:var(--accent)">' + item.damage + '</span>'
      : '<span class="chip chip-fixed"></span>';
  }
  const chipParts = [];
  if (isWip(item.id)) chipParts.push('<span class="chip" style="color:#fff;background:var(--red)">課題</span>');
  if (renderingWip && (item.origin || "").trim()) {
    chipParts.push('<span class="chip" style="color:' + cat.color + ';background:rgba(255,255,255,0.07)">' + esc(item.origin.trim() + ((item.sub || "").trim() ? "・" + item.sub.trim() : "")) + '</span>');
  }
  if (item.category === "micro" && item.microTag) chipParts.push('<span class="chip" style="color:#fff;background:' + microTagColor(item.microTag) + '">' + item.microTag + '</span>');
  if (item.category === "setplay" && item.throwOk) chipParts.push('<span class="chip" style="color:#fff;background:var(--green)">投○</span>');
  if (item.category === "setplay" && item.shimmyOk) chipParts.push('<span class="chip" style="color:#fff;background:#9B7EDE">シ○</span>');
  if ((item.category === "setplay" || item.category === "combo") && item.position) chipParts.push('<span class="chip" style="color:#fff;background:' + (item.position === "端" ? "var(--c-punish)" : "var(--c-macro)") + '">' + item.position + '</span>');
  if (item.drive !== null && item.drive !== undefined) chipParts.push(driveBar(item.drive));
  let rightChips = chipParts.join("");
  let body = "";
  if (expanded) {
    body = '<div class="note-body-wrap"><div class="note-divider"></div>' +
      ((item.recipe || "").trim() ? renderRecipe(item.recipe) : "") +
      '<p class="note-body">' + esc(item.body || "（内容は未記入）") + '</p>' +
      '<div class="note-actions">' +
        (renderingWip ? "" : '<button style="color:rgba(255,255,255,0.6)" data-move-note="up" data-mn-id="' + item.id + '">↑ 上へ</button>' +
        '<button style="color:rgba(255,255,255,0.6)" data-move-note="down" data-mn-id="' + item.id + '">↓ 下へ</button>') +
        '<button style="color:rgba(255,255,255,0.5)" data-edit="' + item.id + '" data-edit-src="' + (renderingWip ? "wip" : "") + '">編集</button>' +
        '<button style="color:var(--red)" data-wip="' + item.id + '">' + (isWip(item.id) ? '課題解除' : '課題にする') + '</button>' +
        (ui.confirmDeleteId === item.id
          ? '<button style="color:#fff;background:var(--red);border-radius:5px;padding:3px 10px;margin-left:auto;font-weight:700" data-delete="' + item.id + '">本当に削除する？</button>'
          : '<button style="color:var(--red);margin-left:auto" data-delete="' + item.id + '">削除</button>') +
      '</div></div>';
  }
  return '<div class="note-card" style="border-left-color:' + cat.color + '">' +
    (function () {
      if (item.category === "combo" && item.damage != null) {
        const pct = Math.max(0, Math.min(100, (item.damage / 10000) * 100));
        const p = pct.toFixed(1);
        const tickStops = [[7, 0.48], [15, 0.48], [23, 0.48], [31, 0.48], [39, 0.48], [47, 0.48], [55, 0.12]].map(function (tp) {
          const t = tp[0];
          const c = 'rgba(46,229,126,' + tp[1] + ')';
          return 'transparent calc(' + t + '% - 1px), ' + c + ' calc(' + t + '% - 1px), ' + c + ' ' + t + '%, transparent ' + t + '%';
        }).join(', ');
        return '<button class="note-head" style="background:linear-gradient(100deg, transparent 0%, ' + tickStops + ', transparent 100%) left bottom / 100% 14% no-repeat, linear-gradient(100deg, rgba(255,210,30,0.1) 0% ' + p + '%, rgba(255,210,30,0.5) ' + p + '% calc(' + p + '% + 1.5px), rgba(47,112,224,0.12) calc(' + p + '% + 1.5px) 100%)" data-toggle="' + cardKey + '">';
      }
      return '<button class="note-head" data-toggle="' + cardKey + '">';
    })() +
      '<div class="note-title-line">' +
        '<span class="imp-dots" style="color:' + cat.color + '">' + impDots(item.importance) + '</span>' +
        leftChip +
        '<span class="note-title">' + esc(item.title) + '</span>' +
      '</div>' +
      (rightChips ? '<div class="right-chips">' + rightChips + '</div>' : "") +
    '</button>' +
    body +
  '</div>';
}

function buildNoteListHtml(m) {
  let listHtml = "";
  if (ui.adding) listHtml += renderForm(null);

  const minImp = ui.minImp || 1;
  const visible = m.notes.filter((n) => n.id === ui.editingId || (n.importance >= minImp && (!ui.wipOnly || isWip(n.id))));
  lastGroupKeys = [];
  lastSubKeys = [];
  const wipNotes = ui.wipOnly ? [] : visible.filter((n) => isWip(n.id) && (ui.editingId !== n.id || ui.editingFromWip));
  if (wipNotes.length) {
    listHtml += '<div class="section-head"><span class="section-dot" style="background:var(--red)"></span>' +
      '<span class="section-label display" style="color:var(--red)">🔥 取り組み中の課題</span>' +
      '<span class="section-count">(' + wipNotes.length + ')</span></div>';
    renderingWip = true;
    listHtml += '<div class="note-list">' + wipNotes.map(renderNoteCard).join("") + '</div>';
    renderingWip = false;
  }

  if (m.notes.length === 0 && !ui.adding) {
    listHtml += '<div class="empty-state"><p>まだメモがありません</p><p>右下の + から追加できます</p></div>';
  } else if (visible.length === 0 && !ui.adding) {
    listHtml += '<div class="empty-state"><p>条件に合うメモがありません</p><p>フィルターを解除すると表示されます</p></div>';
  } else {
    activeCategories().forEach((cat) => {
      const items = visible.filter((n) => n.category === cat.id);
      if (items.length === 0) return;
      listHtml += '<div class="section-head"><span class="section-dot" style="background:' + cat.color + '"></span>' +
        '<span class="section-label display" style="color:' + cat.color + '">' + cat.label + '</span>' +
        '<span class="section-count">(' + items.length + ')</span></div>';
      const hasGroups = items.some((n) => (n.origin || "").trim() !== "" || (n.sub || "").trim() !== "");
      if (hasGroups) {
        const groups = {};
        let order = [];
        items.forEach((n) => {
          const key = (n.origin || "").trim() || "その他";
          if (!groups[key]) { groups[key] = []; order.push(key); }
          groups[key].push(n);
        });
        const savedOrder = (m.groupOrder && m.groupOrder[cat.id]) || [];
        order = order.slice().sort((a, b) => {
          const ia = savedOrder.indexOf(a); const ib = savedOrder.indexOf(b);
          if (ia === -1 && ib === -1) return 0;
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
        const canMoveGroups = order.length > 1;
        order.forEach((key) => {
          const scope = state.screen === "personal" ? "p_" + state.selfId : pairKey(state.selfId, state.oppId);
          const gk = scope + "::" + cat.id + "::" + key;
          lastGroupKeys.push(gk);
          const open = !!ui.openOrigins[gk];
          const g = groups[key];
          // サブグループ集計（開閉状態に関わらずキーを収集）
          const subGroups = {};
          let subOrderArr = [];
          const loose = [];
          g.forEach((n) => {
            const sk = (n.sub || "").trim();
            if (!sk) { loose.push(n); return; }
            if (!subGroups[sk]) { subGroups[sk] = []; subOrderArr.push(sk); }
            subGroups[sk].push(n);
          });
          const savedSub = (m.subOrder && m.subOrder[cat.id + "::" + key]) || [];
          subOrderArr = subOrderArr.slice().sort((a, b) => {
            const ia = savedSub.indexOf(a); const ib = savedSub.indexOf(b);
            if (ia === -1 && ib === -1) return 0;
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
          });
          subOrderArr.forEach((sk) => lastSubKeys.push(gk + "::" + sk));
          const moveBtns = canMoveGroups
            ? '<button class="mini-move" data-move-group="up" data-mg-cat="' + cat.id + '" data-mg-key="' + esc(key) + '">↑</button>' +
              '<button class="mini-move" data-move-group="down" data-mg-cat="' + cat.id + '" data-mg-key="' + esc(key) + '">↓</button>'
            : "";
          const rt = ui.renameTarget;
          const isRenamingGroup = rt && rt.type === "group" && rt.catId === cat.id && rt.key === key;
          if (isRenamingGroup) {
            listHtml += '<div class="origin-head-btn" style="color:' + cat.color + ';border-color:color-mix(in srgb, ' + cat.color + ' 55%, transparent);background:color-mix(in srgb, ' + cat.color + ' 18%, transparent);">' +
              '<input type="text" class="rename-input" data-rename-input="1" value="' + esc(rt.value) + '">' +
              '<button class="mini-move" data-rename-confirm="1" style="background:var(--green);color:#fff">✓</button>' +
              '<button class="mini-move" data-rename-cancel="1">×</button>' +
            '</div>';
          } else {
            const renameBtn = key === "その他" ? "" : '<button class="mini-move" data-rename-group="1" data-rg-cat="' + cat.id + '" data-rg-key="' + esc(key) + '">✎</button>';
            listHtml += '<div class="origin-head-btn" style="color:' + cat.color + ';border-color:color-mix(in srgb, ' + cat.color + ' ' + (open ? 55 : 22) + '%, transparent);background:color-mix(in srgb, ' + cat.color + ' ' + (open ? 18 : 7) + '%, transparent);' + (open ? '' : 'opacity:0.85;') + '" data-origin-toggle="' + esc(gk) + '">' +
              '<span>' + esc(key) + '</span><span class="section-count">(' + groups[key].length + ')</span>' +
              '<span style="margin-left:auto;display:flex;align-items:center;gap:2px">' + renameBtn + moveBtns + (open ? iconChevronUp() : iconChevronDown()) + '</span>' +
            '</div>';
          }
          if (open) {
            listHtml += '<div class="group-body">';
            if (subOrderArr.length === 0) {
              listHtml += '<div class="note-list">' + g.map(renderNoteCard).join("") + '</div>';
            } else {
              if (loose.length) listHtml += '<div class="note-list">' + loose.map(renderNoteCard).join("") + '</div>';
              const canMoveSubs = subOrderArr.length > 1;
              subOrderArr.forEach((sk) => {
                const sgk = gk + "::" + sk;
                const sopen = !!ui.openSubs[sgk];
                const subMove = canMoveSubs
                  ? '<button class="mini-move" data-move-sub="up" data-ms-cat="' + cat.id + '" data-ms-group="' + esc(key) + '" data-ms-key="' + esc(sk) + '">↑</button>' +
                    '<button class="mini-move" data-move-sub="down" data-ms-cat="' + cat.id + '" data-ms-group="' + esc(key) + '" data-ms-key="' + esc(sk) + '">↓</button>'
                  : "";
                const isRenamingSub = rt && rt.type === "sub" && rt.catId === cat.id && rt.groupKey === key && rt.key === sk;
                if (isRenamingSub) {
                  listHtml += '<div class="sub-head-btn" style="color:' + cat.color + ';border-left-color:color-mix(in srgb, ' + cat.color + ' 85%, transparent);background:rgba(255,255,255,0.07);">' +
                    '<input type="text" class="rename-input" data-rename-input="1" value="' + esc(rt.value) + '">' +
                    '<button class="mini-move" data-rename-confirm="1" style="background:var(--green);color:#fff">✓</button>' +
                    '<button class="mini-move" data-rename-cancel="1">×</button>' +
                  '</div>';
                } else {
                  const renameSubBtn = '<button class="mini-move" data-rename-sub="1" data-rs-cat="' + cat.id + '" data-rs-group="' + esc(key) + '" data-rs-key="' + esc(sk) + '">✎</button>';
                  listHtml += '<div class="sub-head-btn" style="color:' + cat.color + ';border-left-color:color-mix(in srgb, ' + cat.color + ' ' + (sopen ? 85 : 45) + '%, transparent);background:rgba(255,255,255,' + (sopen ? '0.07' : '0.03') + ');' + (sopen ? '' : 'opacity:0.85;') + '" data-sub-toggle="' + esc(sgk) + '">' +
                    '<span>' + esc(sk) + '</span><span class="section-count">(' + subGroups[sk].length + ')</span>' +
                    '<span style="margin-left:auto;display:flex;align-items:center;gap:2px">' + renameSubBtn + subMove + (sopen ? iconChevronUp() : iconChevronDown()) + '</span>' +
                  '</div>';
                }
                if (sopen || isRenamingSub) listHtml += '<div class="note-list sub-list">' + subGroups[sk].map(renderNoteCard).join("") + '</div>';
              });
            }
            listHtml += '</div>';
          }
        });
      } else {
        listHtml += '<div class="note-list">' + items.map(renderNoteCard).join("") + '</div>';
      }
    });
  }
  return listHtml;
}

function renderSortRow() {
  const impLabels = { 1: "すべて", 2: "中以上", 3: "高のみ" };
  const minImp = ui.minImp || 1;
  const impBtn = '<button class="sort-btn' + (minImp > 1 ? ' active' : '') + '" data-imp-cycle="1">重要度: ' + impLabels[minImp] + '</button>';
  const wipBtn = '<button class="sort-btn' + (ui.wipOnly ? ' active' : '') + '" style="' + (ui.wipOnly ? 'background:var(--red);border-color:var(--red);color:#fff;' : '') + '" data-wip-only="1">🔥 課題のみ</button>';
  const allOpen = lastGroupKeys.length > 0 && lastGroupKeys.every((k) => ui.openOrigins[k]);
  const openBtn = '<button class="sort-btn" data-open-all="1"' + (lastGroupKeys.length === 0 ? ' style="opacity:0.35"' : '') + '>' + (allOpen ? "すべて閉じる" : "すべて開く") + '</button>';
  return '<div class="sort-row">' + impBtn + wipBtn + openBtn + '</div>';
}

  )).join("");

    return '<button class="seg-btn' + (active ? ' active' : '') + '" style="' + (active && color ? 'background:' + color : active ? 'background:#4a4c55' : '') + '" data-set-position="' + (val || "") + '">' + label + '</button>';
  }).join("");

    const active = dcur === val;

      '<input type="text" placeholder="例：2HP CDR HP 4HP 236HK" value="' + esc(ui.draft.recipe || "") + '" data-draft="recipe">' +
      (ui.draft.recipe && String(ui.draft.recipe).trim() ? '<div style="margin:4px 0 0">' + renderRecipe(ui.draft.recipe) + '</div>' : "");
  }

      '<div class="seg-row">' + impBtns + '</div>' +
      '<p class="field-label">課題</p>' +
      '<div class="seg-row"><button type="button" class="seg-btn' + (ui.draft.wip ? ' active' : '') + '" style="' + (ui.draft.wip ? 'background:var(--red)' : '') + '" data-toggle-wip="1">' + (ui.draft.wip ? '🔥 課題中（タップで解除）' : '課題にする') + '</button></div>' +
      '<div class="field-label-row"><p class="field-label" style="margin:0">詳細メモ</p>' + micBtn("body") + '</div>' +

        '<button class="btn-cancel" data-cancel-form="1">✕ キャンセル</button>' +
        '<button class="btn-save" data-save-form="' + (isEdit ? esc(itemId) : "new") + '">✓ 保存</button>' +
      '</div>' +
    '</div>'
  );
}

    const catId = el.getAttribute("data-ms-cat");
    const groupKey = el.getAttribute("data-ms-group");
    const key = el.getAttribute("data-ms-key");
    updateMatchup((m) => {
      const appear = [];
      m.notes.forEach((n) => {
        if (n.category !== catId) return;
        if (((n.origin || "").trim() || "その他") !== groupKey) return;
        const k = (n.sub || "").trim();
        if (k && appear.indexOf(k) === -1) appear.push(k);
      });
      const okey = catId + "::" + groupKey;
      const saved = (m.subOrder && m.subOrder[okey]) || [];
      const cur = appear.slice().sort((a, b) => {
        const ia = saved.indexOf(a); const ib = saved.indexOf(b);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
      const i = cur.indexOf(key);
      const j = i + (dir === "up" ? -1 : 1);

      const tmp = cur[i]; cur[i] = cur[j]; cur[j] = tmp;

      return Object.assign({}, m, { subOrder: subOrder });

    updateMatchup((m) => {
      const notes = m.notes.slice();

      if (idx === -1) return m;
      const me = notes[idx];
      const myKey = (me.origin || "").trim();
      // 同カテゴリー・同グループ内の隣を探す
      const step = dir === "up" ? -1 : 1;
      let j = idx + step;
      while (j >= 0 && j < notes.length) {

        if (other.category === me.category && (other.origin || "").trim() === myKey && (other.sub || "").trim() === (me.sub || "").trim()) break;
        j += step;

function getFbConfig() {
  try {
    const raw = localStorage.getItem(FB_CONFIG_KEY);
    if (raw) {
      const cfg = JSON.parse(raw);
      if (cfg && cfg.apiKey && cfg.projectId) return cfg;
    }
  } catch (e) {}
  return FB_EMBEDDED_CONFIG;
}

// ---- 課題マーク（人ごと） ----
function wipKeyName() { return (cloud.user && cloud.user.uid) ? cloud.user.uid : "local"; }
function isWip(id) {
  const m = state.wipMarks || {};
  const u = m[wipKeyName()] || {};
  const e = u[id];
  return !!(e && e.on);
}
function setWip(id, on, skipSave) {
  if (!state.wipMarks) state.wipMarks = {};
  const k = wipKeyName();
  if (!state.wipMarks[k]) state.wipMarks[k] = {};
  const cur = state.wipMarks[k][id];
  if (!!(cur && cur.on) === !!on) return;
  state.wipMarks[k][id] = { on: !!on, ts: Date.now() };
  if (!skipSave) save();
}
function toggleWip(id) { setWip(id, !isWip(id)); }
function migrateLocalWip() {
  if (!state.wipMarks || !cloud.user) return;
  const local = state.wipMarks.local;
  if (!local) return;
  const k = cloud.user.uid;
  if (!state.wipMarks[k]) state.wipMarks[k] = {};
  Object.keys(local).forEach((id) => {
    const a = state.wipMarks[k][id], b = local[id];
    if (!a || (b.ts || 0) > (a.ts || 0)) state.wipMarks[k][id] = b;
  });
  delete state.wipMarks.local;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function setFbConfigFromText(text) {
  const m = String(text || "").match(/\{[\s\S]*\}/);
  if (!m) throw new Error("設定が見つかりません。firebaseConfig の { } 全体を貼り付けてください。");
  let cfg;
  try { cfg = JSON.parse(m[0]); }
  catch (e) {
    try { cfg = (new Function("return (" + m[0] + ")"))(); }
    catch (e2) { throw new Error("設定を読み取れませんでした。コピーし直して貼り付けてください。"); }
  }
  if (!cfg || !cfg.apiKey || !cfg.projectId) throw new Error("apiKey / projectId が見つかりません。firebaseConfig 全体を貼り付けてください。");
  const clean = {
    apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId,
    storageBucket: cfg.storageBucket, messagingSenderId: cfg.messagingSenderId, appId: cfg.appId,
  };
  localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(clean));
  return clean;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("スクリプトを読み込めませんでした（ネットワークを確認してください）"));
    document.head.appendChild(s);
  });
}

async function initCloud() {
  const cfg = getFbConfig();
  if (!cfg) { cloud.status = "off"; return; }
  cloud.status = "loading";
  safeRender();
  try {
    const base = "https://www.gstatic.com/firebasejs/" + FB_SDK_VERSION + "/";
    await loadScript(base + "firebase-app-compat.js");
    await loadScript(base + "firebase-auth-compat.js");
    await loadScript(base + "firebase-firestore-compat.js");
    firebase.initializeApp(cfg);
    cloud.db = firebase.firestore();
    try { await cloud.db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
    firebase.auth().onAuthStateChanged(async (user) => {
      cloud.user = user;
      cloud.error = "";
      if (cloud.unsub) { cloud.unsub(); cloud.unsub = null; }
      if (user) {
        await resolveShare();
        migrateLocalWip();
        startCloudListen();
      } else {
        cloud.status = "nologin";
        cloud.shareOwnerUid = null; cloud.shareOwnerEmail = null; cloud.shareInvite = null;
      }
      safeRender();
    });
    firebase.auth().getRedirectResult().catch((e) => {
      cloud.error = cloudErrText(e);
      safeRender();
    });
  } catch (e) {
    cloud.status = "error";
    cloud.error = cloudErrText(e);
    safeRender();
  }
}

function cloudDocRef() {
  const uid = cloud.shareOwnerUid || cloud.user.uid;
  return cloud.db.collection("users").doc(uid).collection("appdata").doc("main");
}

function shareAcceptKey(ownerUid) { return "sf6-cn-share-accept-" + ownerUid; }

// ログイン後、自分宛の共有招待(shares/{自分のGmail})があるか確認する
async function resolveShare() {
  cloud.shareOwnerUid = null; cloud.shareOwnerEmail = null; cloud.shareInvite = null;
  const email = (cloud.user.email || "").toLowerCase();
  if (!email) return;
  try {
    const snap = await cloud.db.collection("shares").doc(email).get();
    if (!snap.exists) return;
    const d = snap.data();
    if (!d || !d.owner || d.owner === cloud.user.uid) return;
    cloud.shareInvite = { owner: d.owner, ownerEmail: d.ownerEmail || "" };
    let decision = null;
    try { decision = localStorage.getItem(shareAcceptKey(d.owner)); } catch (e) {}
    if (decision == null) {
      const ok = confirm((d.ownerEmail || "共有相手") + " の共有メモ帳に招待されています。接続しますか？\n（接続すると全員で同じメモを読み書きします）");
      decision = ok ? "yes" : "no";
      try { localStorage.setItem(shareAcceptKey(d.owner), decision); } catch (e) {}
    }
    if (decision === "yes") {
      cloud.shareOwnerUid = d.owner;
      cloud.shareOwnerEmail = d.ownerEmail || "";
    }
  } catch (e) {}
}

async function shareAddMember() {
  const inp = document.getElementById("share-email-input");
  const errEl = document.getElementById("share-error");
  const setErr = (t) => { if (errEl) errEl.textContent = t; };
  const email = (inp ? inp.value : "").trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr("メールアドレスの形式が正しくありません"); return; }
  if (cloud.user && email === (cloud.user.email || "").toLowerCase()) { setErr("自分のアドレスは追加できません"); return; }
  const list = (cloud.sharedMembers || []).slice();
  if (list.indexOf(email) >= 0) { setErr("すでに追加されています"); return; }
  setErr("");
  try {
    await cloud.db.collection("shares").doc(email).set({ owner: cloud.user.uid, ownerEmail: (cloud.user.email || "").toLowerCase() });
    cloud.sharedMembers = list.concat([email]);
    schedulePush(0);
    render();
  } catch (e) { setErr(cloudErrText(e)); }
}

async function shareRemoveMember(email) {
  if (!confirm(email + " を共有から外しますか？")) return;
  try { await cloud.db.collection("shares").doc(email).delete(); } catch (e) {}
  cloud.sharedMembers = (cloud.sharedMembers || []).filter((m) => m !== email);
  schedulePush(0);
  render();
}

function shareConnect() {
  if (!cloud.shareInvite) return;
  try { localStorage.setItem(shareAcceptKey(cloud.shareInvite.owner), "yes"); } catch (e) {}
  location.reload();
}

function shareDisconnect() {
  if (!cloud.shareOwnerUid) return;
  if (!confirm("共有メモ帳から切断しますか？（自分専用のメモ帳に戻ります。共有メモ帳のデータは消えません）")) return;
  try { localStorage.setItem(shareAcceptKey(cloud.shareOwnerUid), "no"); } catch (e) {}
  location.reload();
}

function startCloudListen() {
  cloud.status = "syncing";
  cloud.ready = false;
  cloud.unsub = cloudDocRef().onSnapshot((snap) => {
    if (snap.metadata.hasPendingWrites) return;
    cloud.ready = true;
    const remoteRaw = snap.exists ? snap.data() : null;
    if (!remoteRaw) {
      // クラウドにまだデータがない → 手元のデータをアップロード
      cloud.status = "syncing";
      schedulePush(0);
      safeRender();
      return;
    }
    if (!cloud.pushTimer) cloud.sharedMembers = remoteRaw.members || [];
    const local = { store: state.store || {}, personalByChar: state.personalByChar || {}, deleted: state.deleted || {}, wipMarks: state.wipMarks || {} };
    const remote = { store: remoteRaw.store || {}, personalByChar: remoteRaw.personalByChar || {}, deleted: remoteRaw.deleted || {}, wipMarks: remoteRaw.wipMarks || {} };
    const merged = mergeCloudData(local, remote);
    const localJson = stableJson(local);
    const mergedJson = stableJson(merged);
    const remoteJson = stableJson(remote);
    if (mergedJson !== localJson) {
      state.store = merged.store;
      state.personalByChar = merged.personalByChar;
      state.deleted = merged.deleted;
      state.wipMarks = merged.wipMarks;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }
    cloud.status = "synced";
    cloud.lastSyncAt = Date.now();
    if (mergedJson !== remoteJson) schedulePush(800);
    safeRender();
  }, (err) => {
    cloud.status = "error";
    cloud.error = cloudErrText(err);
    safeRender();
  });
}

function cloudOnLocalSave() {
  if (cloud.user && cloud.db) schedulePush(1200);
}

function schedulePush(delay) {
  if (!cloud.user || !cloud.db) return;
  if (cloud.pushTimer) clearTimeout(cloud.pushTimer);
  cloud.pushTimer = setTimeout(doPush, delay == null ? 1200 : delay);
}

function doPush() {
  cloud.pushTimer = null;
  if (!cloud.user || !cloud.db) return;
  if (!cloud.ready) { schedulePush(1500); return; }
  const payload = JSON.parse(JSON.stringify({
    store: state.store || {},
    personalByChar: state.personalByChar || {},
    deleted: pruneDeleted(state.deleted || {}),
    wipMarks: state.wipMarks || {},
    members: cloud.sharedMembers || [],
  }));
  payload.savedAt = firebase.firestore.FieldValue.serverTimestamp();
  cloud.status = "syncing";
  safeRender();
  cloudDocRef().set(payload).then(() => {
    cloud.status = "synced";
    cloud.lastSyncAt = Date.now();
    safeRender();
  }).catch((e) => {
    cloud.status = "error";
    cloud.error = cloudErrText(e);
    safeRender();
  });
}

function pruneDeleted(deleted) {
  const cutoff = Date.now() - 60 * 24 * 60 * 60 * 1000;
  const out = {};
  Object.keys(deleted).forEach((id) => { if (deleted[id] >= cutoff) out[id] = deleted[id]; });
  return out;
}

function mergeCloudData(a, b) {
  const deleted = {};
  [a.deleted, b.deleted].forEach((d) => {
    Object.keys(d || {}).forEach((id) => { deleted[id] = Math.max(deleted[id] || 0, d[id] || 0); });
  });
  const prunedDeleted = pruneDeleted(deleted);
  const keep = (n) => n && n.id && !(deleted[n.id] && deleted[n.id] >= (n.updatedAt || 0));

  function mergeMatchup(x, y) {
    if (!x && !y) return null;
    if (!x || !y) {
      const m = x || y;
      return Object.assign({}, m, { notes: (m.notes || []).filter(keep) });
    }
    const newer = (x.metaUpdatedAt || 0) >= (y.metaUpdatedAt || 0) ? x : y;
    const older = newer === x ? y : x;
    const byId = {};
    (x.notes || []).concat(y.notes || []).forEach((n) => {
      if (!n || !n.id) return;
      const p = byId[n.id];
      if (!p || (n.updatedAt || 0) > (p.updatedAt || 0)) byId[n.id] = n;
    });
    const seen = {};
    const notes = [];
    [(newer.notes || []), (older.notes || [])].forEach((arr) => {
      arr.forEach((n) => {
        if (!n || !n.id || seen[n.id]) return;
        seen[n.id] = 1;
        const best = byId[n.id];
        if (keep(best)) notes.push(best);
      });
    });
    return Object.assign({}, older, newer, { notes: notes });
  }

  function mergeMap(ma, mb) {
    const out = {};
    const keys = {};
    Object.keys(ma || {}).forEach((k) => { keys[k] = 1; });
    Object.keys(mb || {}).forEach((k) => { keys[k] = 1; });
    Object.keys(keys).forEach((k) => {
      const m = mergeMatchup((ma || {})[k], (mb || {})[k]);
      if (m) out[k] = m;
    });
    return out;
  }

  function mergeWipMarks(wa, wb) {
    const cutoff = Date.now() - 60 * 24 * 60 * 60 * 1000;
    const out = {};
    const users = {};
    Object.keys(wa || {}).forEach((k) => { users[k] = 1; });
    Object.keys(wb || {}).forEach((k) => { users[k] = 1; });
    Object.keys(users).forEach((u) => {
      const A = (wa || {})[u] || {}, B = (wb || {})[u] || {};
      const ids = {};
      Object.keys(A).forEach((id) => { ids[id] = 1; });
      Object.keys(B).forEach((id) => { ids[id] = 1; });
      const res = {};
      Object.keys(ids).forEach((id) => {
        if (deleted[id]) return;
        const x = A[id], y = B[id];
        const best = (!y || (x && (x.ts || 0) >= (y.ts || 0))) ? x : y;
        if (best && (best.on || (best.ts || 0) >= cutoff)) res[id] = best;
      });
      if (Object.keys(res).length) out[u] = res;
    });
    return out;
  }

  return {
    store: mergeMap(a.store, b.store),
    personalByChar: mergeMap(a.personalByChar, b.personalByChar),
    deleted: prunedDeleted,
    wipMarks: mergeWipMarks(a.wipMarks, b.wipMarks),
  };
}

function stableJson(obj) {
  if (obj === null || typeof obj !== "object") return JSON.stringify(obj);
  if (Array.isArray(obj)) return "[" + obj.map(stableJson).join(",") + "]";
  const keys = Object.keys(obj).filter((k) => obj[k] !== undefined).sort();
  return "{" + keys.map((k) => JSON.stringify(k) + ":" + stableJson(obj[k])).join(",") + "}";
}

function safeRender() {
  if (ui.adding || ui.editingId || ui.recordingField) return;
  render();
}

function cloudErrText(e) {
  if (!e) return "不明なエラー";
  const code = e.code || "";
  if (code === "permission-denied") return "アクセスが拒否されました。Firestoreのセキュリティルールを確認してください。";
  if (code === "auth/unauthorized-domain") return "このサイトのドメインがFirebaseで許可されていません。Authentication→設定→承認済みドメインに追加してください。";
  if (code === "auth/operation-not-allowed") return "Googleログインが有効になっていません。Firebaseコンソールで有効にしてください。";
  if (code === "unavailable") return "オフラインのようです。接続が戻ると自動で同期されます。";
  return String(e.message || e);
}

function cloudLogin() {
  if (typeof firebase === "undefined" || !firebase.auth) return;
  cloud.error = "";
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch((e) => {
    const code = e && e.code;
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
    if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
      firebase.auth().signInWithRedirect(provider).catch((e2) => { cloud.error = cloudErrText(e2); safeRender(); });
      return;
    }
    cloud.error = cloudErrText(e);
    safeRender();
  });
}

function cloudLogout() {
  if (typeof firebase === "undefined" || !firebase.auth) return;
  firebase.auth().signOut();
}

function applyCloudConfig() {
  const ta = document.getElementById("fb-config-text");
  const errEl = document.getElementById("fb-config-error");
  try {
    setFbConfigFromText(ta ? ta.value : "");
    location.reload();
  } catch (e) {
    if (errEl) errEl.textContent = String(e.message || e);
  }
}

function hasLocalCfgOverride() {
  try { return !!localStorage.getItem(FB_CONFIG_KEY); } catch (e) { return false; }
}

function clearCloudConfig() {
  if (!confirm("クラウド同期の設定を解除しますか？（メモのデータは消えません）")) return;
  try { localStorage.removeItem(FB_CONFIG_KEY); } catch (e) {}
  location.reload();
}

function renderCloudSection() {
  const cfg = getFbConfig();
  let inner = "";
  if (!cfg) {
    inner =
      '<p class="desc">Googleアカウントでログインすると、スマホ・PCなど複数の端末で自動的にデータが共有されます。</p>' +
      '<p class="desc">初回のみ設定が必要です：セットアップ手順書のとおりFirebaseの「firebaseConfig」をコピーして、ここに貼り付けてください。</p>' +
      '<textarea id="fb-config-text" rows="4" placeholder="const firebaseConfig = { apiKey: ... } の { } 部分を貼り付け"></textarea>' +
      '<p id="fb-config-error" style="font-size:11px;color:var(--red);margin:0 0 8px"></p>' +
      '<button class="action-btn btn-amber" data-cloud-config-save="1">同期を設定する</button>';
  } else if (cloud.status === "loading") {
    inner = '<p class="desc">☁ 同期機能を読み込み中…</p>';
  } else if (cloud.status === "nologin") {
    inner =
      '<p class="desc">Googleアカウントでログインすると、メモが自動でクラウドに保存され、他の端末とも共有されます。</p>' +
      (cloud.error ? '<p style="font-size:11px;color:var(--red);margin:0 0 8px">' + esc(cloud.error) + '</p>' : '') +
      '<button class="action-btn btn-amber" data-cloud-login="1">Googleでログイン</button>' +
      (hasLocalCfgOverride() ? '<button class="action-btn" style="background:none;color:var(--text-dim);text-decoration:underline;margin-left:8px" data-cloud-config-clear="1">設定を解除</button>' : '');
  } else if (cloud.status === "error") {
    inner =
      '<p style="font-size:12px;color:var(--red);margin:0 0 8px">同期エラー: ' + esc(cloud.error || "不明なエラー") + '</p>' +
      '<button class="action-btn btn-amber" data-cloud-retry="1">再読み込み</button>' +
      (hasLocalCfgOverride() ? '<button class="action-btn" style="background:none;color:var(--text-dim);text-decoration:underline;margin-left:8px" data-cloud-config-clear="1">設定を解除</button>' : '');
  } else {
    const email = cloud.user && (cloud.user.email || cloud.user.displayName) || "";
    const when = cloud.lastSyncAt ? new Date(cloud.lastSyncAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "-";
    const statusLabel = cloud.status === "synced" ? '<span style="color:var(--green)">✓ 同期済み</span>' : '<span style="color:var(--accent)">同期中…</span>';
    inner =
      '<p class="desc" style="margin-bottom:4px">☁ クラウド同期: ' + statusLabel + '　<span style="color:var(--text-faint)">最終同期 ' + when + '</span></p>' +
      '<p class="desc">' + esc(email) + ' としてログイン中。他の端末でも同じURLを開いて同じアカウントでログインすれば、データが自動で共有されます。</p>' +
      (cloud.error ? '<p style="font-size:11px;color:var(--red);margin:0 0 8px">' + esc(cloud.error) + '</p>' : '') +
      '<button class="action-btn" style="background:var(--input);color:var(--text-dim)" data-cloud-logout="1">ログアウト</button>' +
      renderShareBlock();
  }
  return '<div>' + inner + '</div>';
}

function renderShareBlock() {
  if (!cloud.user) return "";
  let html = '<div class="hr" style="margin-top:12px"></div>';
  if (cloud.shareOwnerUid) {
    html +=
      '<p class="desc" style="margin-bottom:4px">👥 <b style="color:var(--accent)">' + esc(cloud.shareOwnerEmail || "共有相手") + ' の共有メモ帳に接続中</b></p>' +
      '<p class="desc">メモは全員で読み書きされます（課題マークは自分専用）。</p>' +
      '<button class="action-btn" style="background:var(--input);color:var(--text-dim)" data-share-disconnect="1">共有から切断</button>';
    return html;
  }
  if (cloud.shareInvite) {
    html +=
      '<p class="desc">👥 ' + esc(cloud.shareInvite.ownerEmail || "共有相手") + ' の共有メモ帳への招待があります。</p>' +
      '<button class="action-btn btn-amber" data-share-connect="1">共有メモ帳に接続する</button>';
    return html;
  }
  const members = cloud.sharedMembers || [];
  const rows = members.map((m) =>
    '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--input);border-radius:6px;padding:6px 10px;margin-bottom:4px">' +
      '<span style="font-size:12px;font-family:JetBrains Mono,monospace">' + esc(m) + '</span>' +
      '<button style="background:none;border:none;color:var(--red);font-size:12px" data-share-remove="' + esc(m) + '">外す</button>' +
    '</div>'
  ).join("");
  html +=
    '<p class="desc" style="margin-bottom:4px">👥 <b>メモ帳の共有</b></p>' +
    '<p class="desc">信頼できる相手のGmailを追加すると、その人はこのURLを開いてGoogleでログインするだけで、あなたと同じメモ帳を読み書きできます（課題マークは人ごとに別）。</p>' +
    rows +
    '<div style="display:flex;gap:6px;margin:6px 0 4px">' +
      '<input type="text" id="share-email-input" placeholder="相手のGmailアドレス" style="flex:1;background:var(--input);border:1px solid var(--border);border-radius:6px;color:#fff;padding:8px 10px;font-size:13px" autocapitalize="none" autocorrect="off">' +
      '<button class="action-btn btn-amber" style="margin-bottom:0" data-share-add="1">追加</button>' +
    '</div>' +
    '<p id="share-error" style="font-size:11px;color:var(--red);margin:0 0 8px"></p>';
  return html;
}

render();
initCloud();
</script>
</body>
</html>
